<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexTime - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6">
  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow p-6 border border-slate-200">
    <div class="flex justify-between items-center pb-4 border-b">
      <div>
        <h1 class="text-xl font-bold text-slate-800" id="welcomeUser">Loading...</h1>
        <p class="text-xs text-slate-500" id="userRole">Role: ...</p>
      </div>
      <button onclick="logout()" class="text-xs bg-rose-50 text-rose-600 px-3 py-1.5 rounded-lg border border-rose-200 hover:bg-rose-100 font-medium transition">
        Keluar
      </button>
    </div>
    <div class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg text-sm text-blue-900">
      Autentikasi berhasil. Sesi login tersimpan di <code>localStorage</code>.
    </div>
  </div>

  <script>
    const userStr = localStorage.getItem("nextime_user");
    if (!userStr) {
      window.location.href = "index.html";
    } else {
      const user = JSON.parse(userStr);
      document.getElementById("welcomeUser").textContent = `Halo, ${user.fullName}`;
      document.getElementById("userRole").textContent = `Role: ${user.role} | Email: ${user.email}`;
    }

    function logout() {
      localStorage.removeItem("nextime_user");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
