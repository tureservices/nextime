<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexTime - Login & Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-8 border border-slate-200">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 text-white rounded-xl font-bold text-2xl shadow-md mb-3">
        N
      </div>
      <h1 class="text-2xl font-bold text-slate-800">NexTime Portal</h1>
      <p class="text-xs text-slate-500 mt-1">Leave & Overtime Management System</p>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-medium"></div>

    <!-- Tabs -->
    <div class="flex border-b border-slate-200 mb-6 text-sm">
      <button id="tabLogin" onclick="switchView('login')" class="flex-1 pb-2 text-center font-semibold text-blue-600 border-b-2 border-blue-600 transition">
        Login
      </button>
      <button id="tabActivate" onclick="switchView('activate')" class="flex-1 pb-2 text-center font-medium text-slate-500 transition">
        Aktivasi
      </button>
      <button id="tabReset" onclick="switchView('reset')" class="flex-1 pb-2 text-center font-medium text-slate-500 transition">
        Reset
      </button>
    </div>

    <!-- 1. LOGIN FORM -->
    <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email Karyawan / Admin</label>
        <input type="email" id="loginEmail" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="name@cincin.com">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" id="loginPassword" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
      </div>
      <button type="submit" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm shadow transition">
        Masuk
      </button>
    </form>

    <!-- 2. ACTIVATION FORM (First-Time User) -->
    <form id="formActivate" onsubmit="handleActivate(event)" class="hidden space-y-4">
      <div id="activateStep1">
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email Terdaftar</label>
        <input type="email" id="activateEmail" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="name@cincin.com">
        <p class="text-[11px] text-slate-400 mt-1">Email harus sudah didaftarkan Administrator di database.</p>
        <button type="button" onclick="verifyActivationEmail()" class="w-full mt-3 bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 rounded-lg text-sm transition">
          Periksa Email
        </button>
      </div>

      <div id="activateStep2" class="hidden space-y-3">
        <div class="bg-blue-50 border border-blue-200 p-2.5 rounded-lg text-xs text-blue-800">
          Akun ditemukan: <strong id="activateName"></strong>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Buat Password Baru (min. 6 karakter)</label>
          <input type="password" id="activatePassword" minlength="6" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm shadow transition">
          Simpan Password & Aktifkan
        </button>
      </div>
    </form>

    <!-- 3. RESET PASSWORD FORM (via OTP) -->
    <form id="formReset" onsubmit="handleResetPassword(event)" class="hidden space-y-4">
      <div id="resetStep1">
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email Akun</label>
        <input type="email" id="resetEmail" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="name@cincin.com">
        <button type="button" onclick="sendResetOtp()" class="w-full mt-3 bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 rounded-lg text-sm transition">
          Kirim Kode OTP
        </button>
      </div>

      <div id="resetStep2" class="hidden space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Kode OTP (6 Digit di Email)</label>
          <input type="text" id="resetOtp" maxlength="6" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm tracking-widest text-center font-bold" placeholder="123456">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Password Baru (min. 6 karakter)</label>
          <input type="password" id="resetNewPassword" minlength="6" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm shadow transition">
          Simpan Password Baru
        </button>
      </div>
    </form>

    <!-- Footer Security Note -->
    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <p class="text-[11px] text-slate-400">Pendaftaran akun baru hanya dapat dilakukan oleh HR/Administrator.</p>
    </div>
  </div>

  <script>
    // Paste your deployed Google Apps Script /exec URL here:
    const API_URL = "https://script.google.com/macros/s/AKfycbxO0spFhKspoBXznN-fKjbRtdP6R4mnCdLNxiX4oUhD4dRZEVjpfwY392b-nvbPtzQw/exec";

    function showAlert(type, msg) {
      const box = document.getElementById("alertBox");
      box.className = `mb-4 p-3 rounded-lg text-xs font-medium ${
        type === 'error' ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'
      }`;
      box.textContent = msg;
      box.classList.remove("hidden");
    }

    function switchView(view) {
      document.getElementById("alertBox").classList.add("hidden");
      ["Login", "Activate", "Reset"].forEach(v => {
        const form = document.getElementById(`form${v}`);
        const tab = document.getElementById(`tab${v}`);
        if (v.toLowerCase() === view) {
          form.classList.remove("hidden");
          tab.className = "flex-1 pb-2 text-center font-semibold text-blue-600 border-b-2 border-blue-600 transition";
        } else {
          form.classList.add("hidden");
          tab.className = "flex-1 pb-2 text-center font-medium text-slate-500 transition";
        }
      });
    }

    // Serverless POST Helper (Avoids CORS preflight rejection)
    async function callApi(payload) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        redirect: "follow"
      });
      return await res.json();
    }

    // 1. Handle Login
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById("btnLogin");
      btn.disabled = true;
      btn.textContent = "Memverifikasi...";

      try {
        const res = await callApi({
          action: "login",
          email: document.getElementById("loginEmail").value.trim(),
          password: document.getElementById("loginPassword").value
        });

        if (res.status === "success") {
          // Store authenticated session locally
          localStorage.setItem("nextime_user", JSON.stringify(res.user));
          showAlert("success", `Login berhasil! Selamat datang, ${res.user.fullName}. Mengalihkan...`);
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1200);
        } else {
          showAlert("error", res.message);
        }
      } catch (err) {
        showAlert("error", "Koneksi ke server gagal: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Masuk";
      }
    }

    // 2. Check Email for First-Time Setup
    async function verifyActivationEmail() {
      const email = document.getElementById("activateEmail").value.trim();
      if (!email) return showAlert("error", "Masukkan alamat email.");

      try {
        const res = await callApi({ action: "checkEmail", email: email });
        if (res.status === "success") {
          if (res.hasPassword) {
            showAlert("error", "Akun ini sudah memiliki password. Silakan login atau gunakan menu Reset.");
          } else {
            document.getElementById("activateName").textContent = res.fullName;
            document.getElementById("activateStep1").classList.add("hidden");
            document.getElementById("activateStep2").classList.remove("hidden");
            showAlert("success", "Email valid. Silakan buat password baru.");
          }
        } else {
          showAlert("error", res.message);
        }
      } catch (err) {
        showAlert("error", "Koneksi gagal: " + err.message);
      }
    }

    // Complete Activation
    async function handleActivate(e) {
      e.preventDefault();
      const email = document.getElementById("activateEmail").value.trim();
      const password = document.getElementById("activatePassword").value;

      try {
        const res = await callApi({ action: "setupPassword", email: email, password: password });
        if (res.status === "success") {
          showAlert("success", res.message);
          setTimeout(() => switchView("login"), 1500);
        } else {
          showAlert("error", res.message);
        }
      } catch (err) {
        showAlert("error", "Koneksi gagal: " + err.message);
      }
    }

    // 3. Request OTP for Password Reset
    async function sendResetOtp() {
      const email = document.getElementById("resetEmail").value.trim();
      if (!email) return showAlert("error", "Masukkan alamat email.");

      try {
        const res = await callApi({ action: "requestReset", email: email });
        if (res.status === "success") {
          document.getElementById("resetStep1").classList.add("hidden");
          document.getElementById("resetStep2").classList.remove("hidden");
          showAlert("success", res.message);
        } else {
          showAlert("error", res.message);
        }
      } catch (err) {
        showAlert("error", "Koneksi gagal: " + err.message);
      }
    }

    // Complete Password Reset
    async function handleResetPassword(e) {
      e.preventDefault();
      const email = document.getElementById("resetEmail").value.trim();
      const code = document.getElementById("resetOtp").value.trim();
      const newPassword = document.getElementById("resetNewPassword").value;

      try {
        const res = await callApi({
          action: "verifyReset",
          email: email,
          code: code,
          newPassword: newPassword
        });

        if (res.status === "success") {
          showAlert("success", res.message);
          setTimeout(() => switchView("login"), 1500);
        } else {
          showAlert("error", res.message);
        }
      } catch (err) {
        showAlert("error", "Koneksi gagal: " + err.message);
      }
    }
  </script>
</body>
</html>
